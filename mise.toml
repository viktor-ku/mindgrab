[tools]
bun = "1.4.2"
rust = "1.96.0"
"npm:@biomejs/biome" = "2.5.14"
"npm:typescript" = "7.0.2"

[tasks.golive]
description = "Make origin/live reference current local main"
run = "git push --force-with-lease origin main:live"

[tasks.db]
description = "Start local Postgres"
run = "docker compose up -d postgres"

[tasks."worktree:bootstrap"]
description = "Create persistent local environment settings for this worktree"
dir = "{{config_root}}"
run = '''
set -eu
worktree_root="$PWD"
workspace_root="$(git worktree list --porcelain | sed -n '1s/^worktree //p')"
cd "$workspace_root"
cargo run --locked --target-dir "$workspace_root/target" -p workspace-bootstrap -- "$worktree_root"
'''

[tasks."tooling:test"]
description = "Verify worktree bootstrap isolation and configuration"
run = "cargo test --locked -p workspace-bootstrap"

[tasks.install]
description = "Install locked workspace dependencies"
run = "bun --bun install --frozen-lockfile"

[tasks."backend:dev"]
description = "Run the Rust API and production static-file server"
run = "cargo run --locked -p mindgrab-backend"

[tasks."backend:build"]
description = "Build the native Rust backend"
run = "cargo build --locked --release -p mindgrab-backend"

[tasks."backend:test"]
description = "Test Rust authentication and persistent Loro sync against isolated Postgres databases"
depends = ["db"]
run = "cargo test --locked -p mindgrab-backend"

[tasks."backend:check"]
description = "Check all Rust code"
depends = ["state:check"]

[tasks."tooling:check"]
description = "Check Rust workspace tooling"
run = ["cargo fmt --all --check", "cargo clippy --locked -p workspace-bootstrap --all-targets -- -D warnings"]

[tasks."webapp:dev"]
description = "Run the Vite dev server"
depends = ["install", "state:build"]
dir = "webapp"
run = "bun --bun run dev"

[tasks."webapp:test"]
description = "Run webapp tests"
depends = ["install", "state:build"]
dir = "webapp"
run = "bun --bun test --conditions browser"

[tasks."webapp:test:browser"]
description = "Alias for e2e:test"
depends = ["e2e:test"]

[tasks."e2e:test"]
description = "Run webapp interaction tests in headless Chromium"
depends = ["install", "state:build"]
dir = "e2e"
run = "bun --bun run test"

[tasks."webapp:test:offline"]
description = "Alias for e2e:test:offline"
depends = ["e2e:test:offline"]

[tasks."e2e:test:offline"]
description = "Verify production shell caching, cold offline reopen and safe upgrades"
depends = ["install", "state:build"]
dir = "e2e"
run = "bun --bun run test:offline"

[tasks."e2e:check"]
description = "Run e2e lint, formatting and type checks"
depends = ["install", "state:build"]
dir = "e2e"
run = "bun --bun run check"

[tasks."webapp:build"]
description = "Build the webapp"
depends = ["install", "state:build"]
dir = "webapp"
run = "bun --bun run build"

[tasks."webapp:check"]
description = "Run webapp lint, formatting and type checks"
depends = ["install", "state:build"]
dir = "webapp"
run = "bun --bun run check"

[tasks.check]
description = "Verify the Rust/Loro app, browser behavior, and offline shell"
depends = ["tooling:test", "tooling:check", "backend:check", "backend:test", "webapp:check", "webapp:test", "e2e:check", "e2e:test", "e2e:test:offline", "webapp:build", "state:test", "state:check", "state:interop"]

[tasks."state:setup"]
description = "Install the Rust WASM target and matching binding generator"
run = ["rustup target add wasm32-unknown-unknown", "cargo install wasm-bindgen-cli --version 0.2.129 --locked"]

[tasks."state:build"]
description = "Compile the Rust document core to browser WASM and generate types"
dir = "{{config_root}}"
run = '''
set -eu
if ! command -v wasm-bindgen >/dev/null 2>&1; then
  echo "Run mise run state:setup to install the WASM target and wasm-bindgen CLI." >&2
  exit 1
fi
cargo build --locked -p mindgrab-state --target wasm32-unknown-unknown --release
mkdir -p webapp/src/generated/mindgrab-state
wasm-bindgen --target web --out-dir webapp/src/generated/mindgrab-state --out-name mindgrab_state target/wasm32-unknown-unknown/release/mindgrab_state.wasm
generated_types="$(cargo run --locked --quiet -p mindgrab-state --features bindings --example generate_types)"
printf '%s\n' "$generated_types" > webapp/src/generated/mindgrab-state/model.ts
'''

[tasks."state:test"]
description = "Test shared Rust document rules and CRDT convergence"
run = "cargo test --locked -p mindgrab-state"

[tasks."state:check"]
description = "Check shared Rust code formatting and warnings"
run = ["cargo fmt --all --check", "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"]

[tasks."state:interop"]
description = "Verify native Rust and browser WASM document interoperability"
depends = ["install", "state:build", "db"]
dir = "e2e"
run = "bun --bun test ./rust-state.browser.ts"
