[tools]
bun = "1.4.2"

[tasks.golive]
description = "Make origin/live reference current local main"
run = "git push --force-with-lease origin main:live"

[tasks.db]
description = "Start local Postgres"
run = "docker compose up -d postgres"

[tasks.install]
description = "Install locked workspace dependencies"
run = "bun --bun install --frozen-lockfile"

[tasks."backend:dev"]
description = "Run the Bun backend with hot reload"
depends = ["install"]
dir = "backend"
run = "bun --bun run dev"

[tasks."backend:rebuild-read-models"]
description = "Rebuild inspection indexes from canonical Yjs storage"
depends = ["install"]
dir = "backend"
run = "bun --bun src/main.ts rebuild-read-models"

[tasks."backend:test"]
description = "Run backend tests against isolated local Postgres databases"
depends = ["install"]
dir = "backend"
run = "bun --bun run test"

[tasks."backend:check"]
description = "Check backend and shared code formatting, lint and types"
depends = ["install"]
dir = "backend"
run = "bun --bun run check"

[tasks."webapp:dev"]
description = "Run the Vite dev server"
depends = ["install"]
dir = "webapp"
run = "bun --bun run dev"

[tasks."webapp:test"]
description = "Run webapp tests"
depends = ["install"]
dir = "webapp"
run = "bun --bun test --conditions browser"

[tasks."webapp:test:browser"]
description = "Run webapp interaction tests in headless Chromium"
depends = ["install"]
dir = "webapp"
run = "bun --bun run test:browser"

[tasks."webapp:test:offline"]
description = "Verify production shell caching, cold offline reopen and safe upgrades"
depends = ["install"]
dir = "webapp"
run = "bun --bun run test:offline"

[tasks."webapp:build"]
description = "Build the webapp"
depends = ["install"]
dir = "webapp"
run = "bun --bun run build"

[tasks."webapp:check"]
description = "Run webapp lint, formatting and type checks"
depends = ["install"]
dir = "webapp"
run = "bun --bun run check"

[tasks.check]
description = "Run backend, shared document and webapp checks"
depends = ["backend:check", "backend:test", "webapp:check", "webapp:test", "webapp:test:browser", "webapp:test:offline", "webapp:build"]

[tasks."crdt:test"]
description = "Run client/backend Yjs interoperability tests"
depends = ["install"]
dir = "webapp"
run = "bun --bun test --conditions browser tests/project-interop.test.ts"

[tasks."crdt:check"]
description = "Check shared document and interoperability code"
depends = ["webapp:check", "backend:check"]

[tasks."crdt:fixtures"]
description = "Regenerate reviewed Yjs binary and JSON golden fixtures"
depends = ["install"]
dir = "webapp"
run = "bun --bun tests/fixtures/generate-yjs.ts"
