[tasks.golive]
description = "Make origin/live reference current local main"
run = "git push --force-with-lease origin main:live"

[tasks.db]
description = "Start local Postgres"
run = "docker compose up -d postgres"

[tasks."server:dev"]
description = "Run the API server"
run = "mise -C server exec -- cargo run"

[tasks."server:reset-legacy-projects"]
description = "Discard ONLY obsolete snapshot tables; retain Yjs projects and authentication"
run = "DATABASE_URL=${DATABASE_URL:-postgres://postgres@localhost:5432/mindgrab} mise -C server exec -- cargo run -- reset-legacy-projects"

[tasks."server:rebuild-read-models"]
description = "Rebuild Yjs inspection indexes from canonical binary storage"
run = "DATABASE_URL=${DATABASE_URL:-postgres://postgres@localhost:5432/mindgrab} mise -C server exec -- cargo run -- rebuild-read-models"

[tasks."server:test"]
description = "Run server tests against local Postgres"
depends = ["crdt:install"]
run = "DATABASE_URL=${DATABASE_URL:-postgres://postgres@localhost:5432/mindgrab} mise -C server exec -- cargo test"

[tasks."server:fmt"]
description = "Check Rust formatting"
run = "mise -C server exec -- cargo fmt --check"

[tasks."server:clippy"]
description = "Lint the server with warnings as errors"
run = "mise -C server exec -- cargo clippy --all-targets -- -D warnings"

[tasks."server:check"]
description = "Run server formatting, lint, and tests"
depends = ["server:fmt", "server:clippy", "server:test"]

[tasks."webapp:install"]
description = "Install locked webapp dependencies"
dir = "webapp"
run = "bun --bun install --frozen-lockfile"

[tasks."webapp:test:cloud"]
description = "Test browser cloud sync against isolated Rust/Postgres endpoints"
depends = ["webapp:install", "webapp:build"]
run = "DATABASE_URL=${DATABASE_URL:-postgres://postgres@localhost:5432/mindgrab} mise -C server exec -- cargo test browser_cloud_sync_recovers -- --ignored"

[tasks."webapp:dev"]
description = "Run the Vite dev server"
dir = "webapp"
run = "bun --bun run dev"

[tasks."webapp:test"]
description = "Run webapp tests"
dir = "webapp"
run = "bun --bun test --conditions browser"

[tasks."webapp:test:browser"]
description = "Run webapp interaction tests in headless Chromium"
dir = "webapp"
run = "bun --bun test ./tests/browser/editor.browser.ts ./tests/browser/project-repository.browser.ts ./tests/browser/accounts.browser.ts"

[tasks."webapp:test:offline"]
description = "Verify production shell caching, cold offline reopen, and safe upgrades"
dir = "webapp"
run = "bun --bun run test:offline"

[tasks."webapp:build"]
description = "Build the webapp"
depends = ["webapp:install"]
dir = "webapp"
run = "bun --bun run build"

[tasks."webapp:check"]
description = "Run webapp lint, formatting, and type checks"
dir = "webapp"
run = "bun --bun run check"

[tasks."test:release"]
description = "Verify the production local-first stack, faults, recovery, and release budgets"
depends = ["webapp:install", "crdt:install"]
run = "DATABASE_URL=${DATABASE_URL:-postgres://postgres@localhost:5432/mindgrab} mise -C server exec -- cargo test release_stack_recovers_and_converges -- --ignored --nocapture"

[tasks.check]
description = "Run all server and webapp checks"
depends = ["server:check", "webapp:check", "webapp:test", "webapp:test:browser", "webapp:test:cloud", "webapp:test:offline", "webapp:build", "crdt:test", "crdt:check", "test:release"]

[tasks."crdt:install"]
description = "Install locked interoperability test tools"
depends = ["webapp:install"]
dir = "tools/yjs-contract"
run = "bun --bun install --frozen-lockfile"

[tasks."crdt:test"]
description = "Run Yjs/Yrs interoperability tests"
depends = ["crdt:install"]
dir = "tools/yjs-contract"
run = "bun --bun test"

[tasks."crdt:check"]
description = "Check CRDT contract TypeScript and Rust"
depends = ["crdt:install"]
run = '''
(cd tools/yjs-contract && bun --bun run check)
mise -C server exec -- cargo fmt --manifest-path "{{config_root}}/tools/yjs-contract/rust/Cargo.toml" --check
mise -C server exec -- cargo clippy --locked --manifest-path "{{config_root}}/tools/yjs-contract/rust/Cargo.toml" --all-targets -- -D warnings
'''

[tasks."crdt:fixtures"]
description = "Regenerate reviewed Yjs binary and JSON golden fixtures"
depends = ["crdt:install"]
dir = "tools/yjs-contract"
run = "bun --bun run fixtures"
