# Example same-origin deployment. Supply your TLS certificates and public host.
map $http_upgrade $mindgrab_connection {
    default upgrade;
    '' close;
}

upstream mindgrab_api {
    server 127.0.0.1:3000;
    # Additional compatible processes must use the same Postgres primary.
}

server {
    listen 443 ssl;
    server_name mindgrab.example;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    root /srv/mindgrab/webapp/dist;

    location /api/ {
        proxy_pass http://mindgrab_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mindgrab_connection;
        proxy_set_header Origin $http_origin;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 10m;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /legacy-reset-worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
