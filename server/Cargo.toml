[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
serde = { version = "=1.0.229", features = ["derive"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tracing-subscriber = "=0.3.23"
