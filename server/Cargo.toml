[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "=0.8.9"
axum-extra = { version = "=0.12.6", features = ["cookie"] }
base64 = "=0.23.1"
dotenvy = "=0.15.7"
jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
rand = "=0.10.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "json"] }
time = "=0.3.55"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "=0.6.11", features = ["cors"] }
tracing-subscriber = "=0.3.23"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
