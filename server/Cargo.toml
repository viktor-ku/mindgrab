[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["ws"] }
axum-extra = { version = "=0.12.6", features = ["cookie"] }
axum-server-timing = "=3.0.1"
base64 = "=0.23.1"
dotenvy = "=0.15.7"
jsonwebtoken = { version = "=11.1.0", features = ["rust_crypto"] }
rand = "=0.10.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "json", "uuid", "time"] }
time = "=0.3.55"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
uuid = { version = "=1.26.1", features = ["serde"] }
tower-sessions = { version = "=0.14.0", default-features = false, features = ["axum-core"] }
tower-http = { version = "=0.6.11", features = ["cors", "limit", "set-header", "validate-request"] }
tracing-subscriber = "=0.3.23"
yrs = { version = "=0.28.0", features = ["small-client"] }
axum-login = "=0.18.0"

[dev-dependencies]
socket2 = "=0.6.5"
futures-util = { version = "=0.3.34", features = ["sink"] }
tokio-tungstenite = "=0.29.0"
tower = { version = "=0.5.3", features = ["util"] }
