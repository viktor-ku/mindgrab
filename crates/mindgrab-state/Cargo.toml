[package]
name = "mindgrab-state"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
bindings = ["dep:ts-rs"]

[dependencies]
loro = "=1.16.2"
loro-internal = "=1.16.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "=12.0.1", optional = true, features = ["no-serde-warnings"] }

[[example]]
name = "generate_types"
required-features = ["bindings"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
getrandom = { version = "0.2", features = ["js"] }
